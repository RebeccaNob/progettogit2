<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esempio button</title>
</head>
<body>
    <a href="index.html"> Torna all'indice</a>
    <br />
    <h1>Esempio bottone</h1>
    <button>Press me</button>

    <h2>Login Form</h2>

    <form action="">
        <label for="usr">Username:</label>
        <input type="text" name="username" placeholder="Insert username" id="urs" required>
        <br>
        <label for="pwd">Password:</label>
        <input type="password" name="pwd" placeholder="Insert password" id="pwd" required>
        <br>
        <input type="submit" value="Login">
    </form>

<h2>Registration Form</h2>

<form action="">
    <label>
        Nome:
        <input type="text" name="nome">
    </label>

    <label>
        Cognome:
        <input type="text" name="cognome">
    </label>
    <p></p>
    <label>
        Data di nascita:
        <input type="date" name="data di nascita">
    </label>

    <p></p>
    <label>
        Email:
        <input type="email" name="email">
    </label>

    <p></p>
    <label>
        Colore preferito:
        <input type="color" name="prefCol">
    </label>

    <p></p>
    <label>
        Lascia il tuo CV 
        <input type="file" name="cv">
    </label>

    <p></p>
    <p>Sesso:</p>

    <label>
        <input type="radio" name="sesso">
        Femmina
    </label>

    <label>
        <input type="radio" name="sesso">
        Maschio
    </label>

    <label>
        <input type="radio" name="sesso">
        Altro
    </label>

    <p>Hobbies:</p>
    
    <label>
        <input type="checkbox" name="hobbies">
        Nuoto
    </label>
    
    <label>
        <input type="checkbox" name="hobbies">
        Musica
    </label>

    <label>
        <input type="checkbox" name="hobbies">
        Lettura
    </label>

    <p></p>

    <label>
        Comune di nascita:
        <select name="comune">
            <option value="Torino">Torino</option>
            <option value="Livorno">Livorno</option>
            <option value="Cagliari">Cagliari</option>
        </select>
    </label>
    <p></p>
    <input type="submit" value="Registrati">
    
</form>
</body>
</html>
