<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout Grid</title>
    <style>
        @media screen and (max-width: 600px) {
        body{
            display: grid;
            grid-template-columns: 1fr;
            grid-template-rows: 1fr 1fr 7fr 3fr 1fr;
            grid-template-areas: 
                "header"
                "nav "
                "main"
                "aside"
                "footer";
                column-gap: 10px;
                row-gap: 10px;
        }
        }
        @media screen and (min-width: 601px) {
        body{
            display: grid;
            grid-template-columns: 1fr 3fr;
            grid-template-rows: 1fr 1fr 10fr 1fr;
            grid-template-areas: 
                "header header"
                "nav nav"
                "aside main"
                "footer footer";
                column-gap: 10px;
                row-gap: 10px;
        }
        }
        header{
            grid-area: header;
            background-color:rgb(194, 154, 168);
        }

        nav{
            grid-area: nav;
            background-color:lightcoral;
        }

        aside{
            grid-area: aside;
            background-color: rgb(172, 209, 240);
        }

        main{
            grid-area: main;
            background-color: rgb(218, 189, 126);
        }

        footer{
            grid-area: footer;
            background-color: rgb(136, 214, 159);
        }

    </style>
</head>
<body>
    <header >Header</header>
     <nav>
        <ul>
            <li>
                <a href="index.html">Torna all'indice</a>
            </li>
        </ul>
    </nav>
    <aside>Aside</aside>
    <main>Main</main>
    <footer>Footer</footer>    
</body>
</html>
