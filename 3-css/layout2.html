<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout Flex</title>
    <style>
        header{
            height: 150px;
            background-color: darkred;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 20px ;
        
        }
        header>h1{
            color:aliceblue;
            padding: 50px;
        }
        article{
            background-color: rgb(205, 115, 115);
            margin: 10px;
            padding: 10px 20px;
            border-radius: 30px;
            flex: 1;
        }
        section{
            display: flex;
            flex-direction: row;
            justify-content: space-evenly;
            align-items: center;
            flex-wrap: wrap;
        }

        article:nth-of-type(3){
            flex: 2;
        }

        .flex-box {
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: flex-start;
            margin: 10px;
        }

        .flex-box button {
            margin: 5px;
            padding: 10px;
            background-color:rgb(235, 213, 213);
            border: none;
            border-radius: 30px;
            cursor: pointer;
        }

    </style>
</head>
<body>
     <nav>
        <ul>
            <li>
                <a href="index.html">Torna all'indice</a>
            </li>
        </ul>
    </nav>

    <header>
  <h1>Sample flexbox example</h1>
</header>
<section >
  <article>
    <h2>First article</h2>
    <p>Content…</p>
  </article>
  <article>
    <h2>Second article</h2>
    <p>Content…</p>
  </article>
  <article>
    <h2>Third article</h2>
    <p>Content…</p>
  </article>
  <article>
    <div class="flex-box">
        <button type="button">b1</button>
        <button type="button">b2</button>
        <button type="button">b3</button>
        <button type="button">b4</button>
    </div>
  </article>
</section>
</body>
</html>
